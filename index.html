<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Неоднозначный заказ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Inter+Tight:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ece2d2;
    --ink: #2b241d;
    --muted: #7d6f5d;
    --clay: #b4643f;
    --serif: "Fraunces", Georgia, serif;
    --sans: "Inter Tight", "Helvetica Neue", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 40px 20px;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    display: grid;
    justify-items: center;
    text-align: center;
    gap: 22px;
    max-width: 380px;
  }

  .photo {
    width: min(80vw, 340px);
    aspect-ratio: 1 / 1;
    border-radius: 14px;
    overflow: hidden;
    background: #ded2bf;
    box-shadow: 0 24px 48px -28px rgba(74, 56, 38, .55);
  }

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    opacity: 0;
    transition: opacity .5s ease;
  }

  .photo img.is-loaded { opacity: 1; }

  h1 {
    margin: 6px 0 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(32px, 7vw, 42px);
    line-height: 1;
    letter-spacing: -.02em;
  }

  .price {
    margin: -8px 0 0;
    font-size: 15px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }

  .order {
    display: grid;
    place-items: center;
    width: 100%;
    max-width: 260px;
    height: 52px;
    margin-top: 4px;
    border-radius: 10px;
    background: var(--clay);
    color: #fdf7ee;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: .01em;
    text-decoration: none;
    transition: background .2s ease, transform .12s ease;
  }

  .order:hover { background: #c1744c; }
  .order:active { transform: translateY(1px); }

  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      transition-duration: .01ms !important;
    }
  }

  h1 span {
    opacity: 0.2;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="photo">
      <img id="photo" src="image.png" alt="" decoding="async">
    </div>
    <h1>Куни <span>Ли</span></h1>
    <p class="price">бесплатно</p>
    <a class="order" id="order" href="https://t.me/dnbdealer" target="_blank" rel="noopener">Заказать</a>
  </main>

<script>
  const USERNAME = 'dnbdealer';
  const order = document.getElementById('order');

  function orderLink() {
    const now = new Date();
    const date = now.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' });
    const time = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    const message = 'Заказ оформлен. Дата: ' + date + ', время: ' + time;
    return 'https://t.me/' + USERNAME + '?text=' + encodeURIComponent(message);
  }

  order.addEventListener('click', (event) => {
    event.preventDefault();
    window.open(orderLink(), '_blank', 'noopener');
  });

  const photo = document.getElementById('photo');
  photo.addEventListener('load', () => photo.classList.add('is-loaded'));
  photo.addEventListener('error', () => { photo.alt = 'Фото недоступно'; });
</script>
</body>
</html>
